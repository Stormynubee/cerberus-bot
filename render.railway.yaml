# Railway blueprint for Cerberus (GreekBot) — always-on Discord bot.
# After buying Railway, import this or create the service manually with:
#   - Source: https://github.com/Stormynubee/cerberus-bot (branch: main)
#   - Build:  npm ci && npx prisma generate && npm run build
#   - Start:  node dist/index.js
#   - Root:   /  (repo root — package.json is at root)

# Managed Postgres (Railway) — free/cheap, always-on.
databases:
  - name: cerberus-db
    plan: starter

  # Managed Redis (Railway) — needed for locks/cooldowns.
  - name: cerberus-redis
    plan: starter

services:
  - name: cerberus-bot
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node dist/index.js
    healthcheckPath: /health
    healthcheckTimeout: 100
    autoDeploy: true
    env:
      - key: NODE_ENV
        value: production
      # CRITICAL: set in Railway dashboard (never commit)
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      # Railway Postgres internal URL (dashboard → cerberus-db → connect)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Railway Redis internal URL (dashboard → cerberus-redis → connect)
      - key: REDIS_URL
        sync: false
      - key: PUBLIC_STATE_API_KEY
        sync: false
      # MUST be unset/empty so the bot connects to Discord (not paused)
      - key: HOSTING_ROLE
        value: ""
      # Port for Render/health — Railway injects PORT; keep default
      - key: PORT
        value: "3000"
      - key: KEEP_ALIVE_URL
        value: ""
