# GreekBot on Render — Discord bot.
# IMPORTANT for paid/client work: use plan "starter" (or higher), NOT free.
# Free spins down after ~15m idle → Discord "application did not respond".
# Neon Postgres is external; set DATABASE_URL + DIRECT_URL in the Render dashboard.
services:
  - type: web
    name: greekbot
    runtime: node
    region: ohio
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: KEEP_ALIVE_URL
        value: https://greekbot.onrender.com
      - key: STARTING_BALANCE
        value: "1000"
      - key: DAILY_REWARD
        value: "250"
      - key: MIN_BET
        value: "10"
      - key: MAX_BET
        value: "25000"
      - key: CHALLENGE_TTL_SECONDS
        value: "60"
      - key: HG_EVENT_DELAY_MS
        value: "7500"
      - key: HG_MIN_PLAYERS
        value: "4"
      - key: HG_MAX_PLAYERS
        value: "24"
      - key: BIG_WIN_THRESHOLD
        value: "500"

  # Optional: external keep-alive cron (needs billing on Render).
  # Prefer upgrading the web service to Starter — Free will still cold-start.
  # Or use https://cron-job.org → GET https://greekbot.onrender.com/health every 5m.
